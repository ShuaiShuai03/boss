name: Main
on:
  # push:
  #   tags:
  #     - '*'
  workflow_dispatch:
  # schedule:
  #  - cron: "30 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      current_time: ${{ steps.current_time.outputs.current_time }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get current time
        id: current_time
        run: echo "current_time=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Set Release Environment
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "VITE_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "VITE_RELEASE_MODE=release" >> $GITHUB_ENV

      - name: Set Prerelease Environment
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "VITE_VERSION=${{ steps.current_time.outputs.current_time }}.alpha" >> $GITHUB_ENV
          echo "VITE_RELEASE_MODE=alpha" >> $GITHUB_ENV

      - name: Watch Environment
        run: echo "version=$VITE_VERSION,mode=$VITE_RELEASE_MODE"

      - name: Type check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Unit and source contract tests
        run: bun run test

      - name: Build Chrome MV3
        run: bun run build:chrome

      - name: Verify built artifacts
        run: bun run test:built

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Verify Chrome UI
        run: bun run test:e2e

      - name: Package Chrome extension
        run: bun run zip:chrome

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boss-helper-chrome
          path: .output/*-chrome.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: find dist -maxdepth 2 -type f -print

      - name: Release
        uses: softprops/action-gh-release@v2.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: dist/**/*.zip

      - name: Prerelease
        uses: softprops/action-gh-release@v2.0.4
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{needs.build.outputs.current_time}}
          tag_name: ${{needs.build.outputs.current_time}}
          fail_on_unmatched_files: true
          prerelease: true
          files: dist/**/*.zip
